# yaml-language-server: $schema=https://gh-dash.dev/schema.json
include:
  - common.yml

issuesSections:
  - title: WG Issues
    filters: is:open repo:PowerShell/PowerShell label:Needs-Triage label:WG-Interactive-IntelliSense,WG-Interactive-Debugging,WG-Interactive-HelpSystem,WG-Interactive-Console,WG-Interactive-PSReadLine -label:WG-Reviewed
  - title: RFCs
    filters: is:open repo:PowerShell/PowerShell-RFC
  - title: PSBlog
    filters: is:open repo:PowerShell/PowerShell-Blog
  - title: ComBlog
    filters: is:open repo:PowerShell/Community-Blog
  - title: Distros
    filters: is:open repo:PowerShell/PowerShell label:Distribution-Request,Distribution-Supported,Distribution-Declined
  - title: DSRs
    filters: is:open repo:PowerShell/PowerShell "[DSR]"
  - title: DotDocker
    filters: is:open repo:dotnet/dotnet-docker
  - title: PS PRs
    filters: is:open repo:PowerShell/PowerShell

prSections:
  - title: WG PRs
    filters: is:open repo:PowerShell/PowerShell label:Needs-Triage label:WG-Interactive-IntelliSense,WG-Interactive-Debugging,WG-Interactive-HelpSystem,WG-Interactive-Console,WG-Interactive-PSReadLine -label:WG-Reviewed
  - title: RFCs
    filters: is:open repo:PowerShell/PowerShell-RFC
  - title: PSBlog
    filters: is:open repo:PowerShell/PowerShell-Blog
  - title: ComBlog
    filters: is:open repo:PowerShell/Community-Blog
  - title: DSRs
    filters: is:open repo:PowerShell/PowerShell "[DSR]"
  - title: DotDocker
    filters: is:open repo:dotnet/dotnet-docker
  - title: PS PRs
    filters: is:open repo:PowerShell/PowerShell
